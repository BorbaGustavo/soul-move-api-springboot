spring.application.name=soul-move-api

spring.datasource.url=${ORACLE_FIAP_URL}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Você pode separar por vírgulas ou usar uma lista
cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://seu-projeto.vercel.app

soulmove.regras.max-registros-por-atividade-dia=99

spring.datasource.username=${ORACLE_FIAP_USER}
spring.datasource.password=${ORACLE_FIAP_PASS}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.jpa.properties.hibernate.format_sql=true